name: NSE scanner

on:
  schedule:
    # Intraday: every 5 minutes from 09:30 to 15:25 IST (04:00 to 09:55 UTC), Monday to Friday.
    # The script itself only sends alerts between 9:30 AM and 2:45 PM IST.
    - cron: "*/5 4-9 * * 1-5"
    # MTF / positional: once after the market closes, 4:00 PM IST (10:30 UTC).
    # This run also settles that day's intraday signals in the journal.
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which scan to run"
        type: choice
        default: intraday
        options: [intraday, mtf]
      test:
        description: "Only send a test message to Telegram"
        type: boolean
        default: false

permissions:
  contents: write   # lets the scanner save journal.csv and summary.md into this repository

concurrency:
  group: nse-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # Remembers which alerts were already sent, so you do not get the same one again.
      - uses: actions/cache@v4
        with:
          path: state.json
          key: scanner-state-${{ github.run_id }}
          restore-keys: scanner-state-

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TEST: ${{ inputs.test }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
            ARGS="--mode $MODE --force"
            if [ "$INPUT_TEST" = "true" ]; then ARGS="$ARGS --test"; fi
          elif [ "$SCHEDULE" = "30 10 * * 1-5" ]; then
            ARGS="--mode mtf"
          else
            ARGS="--mode intraday"
          fi
          python nse_scan.py $ARGS

      # Saves the signal journal back into the repository, only when something changed.
      - name: Save journal
        if: always()
        run: |
          git config user.name "nse-scanner-bot"
          git config user.email "nse-scanner-bot@users.noreply.github.com"
          for f in journal.json journal.csv summary.md; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update signal journal"
            git pull --rebase --autostash || true
            git push || echo "Could not push the journal this time; it will be retried on the next run."
          fi
